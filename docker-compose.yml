services:
  app:
    image: local/infinite-canvas
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infinite-canvas
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
    restart: unless-stopped

  agent:
    image: local/infinite-canvas-agent
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: infinite-canvas-agent
    environment:
      - AGENT_HOST=0.0.0.0
      - PORT=17371
      - AGENT_TOKEN=${AGENT_TOKEN:-}
    ports:
      - "17371:17371"
    restart: unless-stopped